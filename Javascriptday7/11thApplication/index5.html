<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    function prime(num){
      if(num<2){
        console.log("Not Prime")
      }
      else{
        for(let i=2;i<=num/2;i++){
          if(num%i==0){
            console.log("Not Prime")
            break
          }
        else{
            console.log("Prime")
            
          }
        }
      }
    }
    prime(90)
  </script>
</body>
</html>
