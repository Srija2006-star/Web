<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table</title>
</head>
<body>
  <table border="1" cellspacing="10" cellpadding="14" bgcolor="pink" align="center">
    <thead bgcolor="yellow" align="center">
      <tr>
        <th>Emp Id</th>
        <th>Name</th>
        <th>Salary</th>
      </tr>
    </thead>
    <tbody bgcolor="lightblue" align="center">
      <tr>
        <td>1</td>
        <td>John</td>
        <td>1000</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Jane</td>
        <td>2000</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
