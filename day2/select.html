<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Tag</title>
</head>
<body>
  <select>
    <option>India</option>
    <option>Russia</option>
    <option>Japan</option>
    <option disabled>Germany</option>
    <option selected disabled>Country</option>
    <option label="USA">United States of America</option>
  </select>
  <select required>
    <option>Mumbai</option>
    <option>Delhi</option>
    <option>Bangalore</option>
  </select>
  <select multiple>
    <option>Apple</option>
    <option>Banana</option>
    <option>Grapes</option>
    <option>Mango</option>
  </select>
</body>
</html>
