<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex</title>
  <style>
    .products{
      height:600px;
      display:flex;
      background-color:rgb(180, 200, 80);
      justify-content:center;
      gap:20px;
      align-items:center;
      flex-wrap:wrap;
    }
    .box{
      border:1px solid black;
      height:100px;
      width:100px;
      background-color:rgb(116, 25, 55);
      color:rgb(243, 255, 240);
      text-align:center;
      box-sizing:border-box;
      padding-top:40px;
    }
  </style>
</head>
<body>
  <div class="products">
    <div class="box">Cakes</div>
    <div class="box">Cookies</div>
    <div class="box">Pastries</div>
  </div>
</body>
</html>
