<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display</title>
  <style>
    #display-container {
      display:none;
    }
    #d {
      display:inline;
      background-color:lightgreen;
    }
    #t {
      display:block;
      background-color:lightblue;
    }
  </style>
</head>
<body>
  <div id="display-container">
    <p>Hello, World!</p>
  </div>
  <div>
    Welcome to the Display Page.
    <p id="d">This is a simple display page.</p>
  </div>
  <div>
    <p id="t">Click.</p>
  </div>
</body>
</html>
