<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover properties</title>
  <style>
    div{
      width: 200px;
      height: 100px;
      background-color: lightblue;
      text-align: center;
      ;
    }
    div:hover{
      background-color: lightgreen;
      transition: 1s;
      color:brown;
    }
  </style>
</head>
<body>
  <div>
    <h2>Abhi</h2>
    <p>Full Stack Developer</p>
    </div>
</body>
</html>
