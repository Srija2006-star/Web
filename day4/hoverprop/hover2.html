<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover</title>
  <style>
    #Box{
      width: 200px;
      height: 200px;
      background-color: lightblue;
      text-align: center;
     }
    #Box:hover{
      background-color: lightgreen;
      transition: 1s;
      transform: translateX(50px);
    }
  </style>
</head>
<body>
  <div id="Box">
    <p>Hi</p>
  </div>
</body>
</html>
