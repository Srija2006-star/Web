<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Ember ☕</title>
  <style>
    .cafe{
      height:100vh;
      color:white;
      font-size:50px;
      background-color: rgba(152, 101, 60, 0.8);
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .cafe:hover{
      background-image:url('https://images.pexels.com/photos/34006888/pexels-photo-34006888.jpeg');
      background-repeat:no-repeat;
      background-position:center; 
      background-size:cover;
      background-attachment:fixed;
      display:flex;
      justify-content:center;
      align-items:center;
    }
  </style>
</head>
<body>
  <div class="cafe">
    <h2>Welcome to Cafe Ember ☕</h2>
  </div>
</body>
</html>
