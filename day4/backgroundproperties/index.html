<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Properties</title>
  <style>
    div{
      background-color: rgba(65, 171, 72, 0.5);
      color:rgb(174, 30, 30);
      height:100px;
      width: 100px;
      text-align:center;
      
    }
    div:hover{
      background-color: rgba(72, 65, 171, 0.9);
      color:rgb(174, 30, 167);
      transition: 1s;
      transform:scale(1.2);
      
    }
  </style>
</head>
<body>
  <div>
    <h2>
      Srija 
    </h2>
  </div>
</body>
</html>
