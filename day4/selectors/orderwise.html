<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orderwise Selector</title>
  <style>
    div p{
      color:blueviolet;
      background-color:lightblue;
    }
    #first p{
      color:rgb(0, 72, 255);
      background-color:lightgreen;
    }
    #second p{
      color:rgb(255, 0, 0);
      background-color:lightyellow;
    }
  </style>
</head>
<body>
  <p>Hello, I am a paragraph with orderwise selector styling.</p>
  <div>
    <p>Hello, I am a paragraph inside a div with orderwise selector styling.</p>
  </div>
  <div id="first">
    <p>Hello, I am another paragraph inside a div with orderwise selector styling.</p>
  </div>
  <div id="second">
    <p>Hello, I am yet another paragraph inside a div with orderwise selector styling.</p>
  </div>
</body>
</html>
