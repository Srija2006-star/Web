<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Selector</title>
  <style>
    #abc{
      color: rgb(203, 145, 46);
      text-align:center;
      background-color: rgb(255, 127, 229);
    }
    *{
      color: rgb(46, 203, 62);
      text-align:center;
      background-color: rgb(19, 12, 158);
    }
    
  </style>
</head>
<body>
  <p>Hi! I am Srija Banerjee.</p>
  <p>Hello</p>
  <h1>Hi! I am Srija Banerjee.</h1>
  <div id="abc">
    <button>Srija Banerjee.</button>
  </div>
</body>
</html>
