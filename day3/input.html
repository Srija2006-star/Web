<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Tag</title>
</head>
<body>
  <label>Name</label><br>
  <input placeholder="Enter your name"><br><br>
  <label>Email</label><br>
  <input type="Email" placeholder="Enter your Email"><br><br>
  <label>Password</label><br>
  <input type="Password" placeholder="Enter your Password"><br><br>
  <label>Mobile No</label><br>
  <input type="Tel" placeholder="Enter your Mobile No"><br><br>
  <label>DOB</label><br>
  <input type="Datetime-local" placeholder="Enter your DOB"><br><br>
  <label>Resume</label><br>
  <input type="File" placeholder="Upload your Resume"><br><br>
  <label>Checkbox</label><br>
  <input type="Checkbox" placeholder="Agree to terms and conditions">
  <label>Radio</label><br>
  <input type="Radio" placeholder="Select your gender"><br><br>
  <label>Range</label><br>  
  <input type="Range" placeholder="Select your range"><br><br>
  <label>Color</label><br>    
  <input type="Color" placeholder="Select your color"><br><br>  
</body>
</html>
