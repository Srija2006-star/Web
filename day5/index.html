<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model</title>
  <style>
    .box{
      background-color:aqua;
      width:300px;
      height:150px;
      text-align:center;
      border:2px solid black;
      margin:4px;
      padding:20px;
      box-sizing:border-box;
      }
      p{
        border-bottom:2px solid rgb(132, 43, 43);
        padding-bottom:10px;
      }
  </style>
</head>
<body>
  <div class="box">
    <p>Hello, World!</p>
  </div>
  <div class="box">
    <p>Books</p>  
  </div>
</body>
</html>
